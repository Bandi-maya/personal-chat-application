name: Build Chaty APK

on:
  push:
    branches:
      - chaty-apk-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify Chaty source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chaty-build chaty_flutter
          mkdir -p /tmp/chaty-build/source
          cat chaty-build/chunk_00.b64 chaty-build/chunk_01.b64 chaty-build/chunk_02_*.part chaty-build/chunk_03.b64 chaty-build/chunk_04.b64 chaty-build/chunk_05.b64 chaty-build/chunk_06.b64 chaty-build/chunk_07.b64 | base64 --decode > /tmp/chaty-build/chaty.zip
          echo "8aeb1c7e54b0c35ebf324627ba4e9745b4d0c2fdc52b6ace8a2138b5c85b98f8  /tmp/chaty-build/chaty.zip" | sha256sum --check
          unzip -q /tmp/chaty-build/chaty.zip -d /tmp/chaty-build/source
          test -f /tmp/chaty-build/source/chaty_flutter/pubspec.yaml
          cp -a /tmp/chaty-build/source/chaty_flutter ./chaty_flutter

      - name: Fix registration confirmation flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('chaty_flutter/lib/features/auth/presentation/register_screen.dart')
          s = p.read_text()
          old = """      if (response.session == null) {
                await showDialog<void>(
                  context: context,
                  builder: (BuildContext context) => AlertDialog(
                    title: const Text('Verify your email'),
                    content: const Text(
                      'Your account was created. Open the verification email, then sign in.',
                    ),
                    actions: [
                      FilledButton(
                        onPressed: () => Navigator.of(context).pop(),
                        child: const Text('Continue'),
                      ),
                    ],
                  ),
                );
                if (mounted) context.go('/login');
              } else {
                context.go('/home');
              }"""
          new = """      if (response.session == null) {
                final bool? confirmed = await showDialog<bool>(
                  context: context,
                  barrierDismissible: false,
                  builder: (BuildContext dialogContext) => AlertDialog(
                    title: const Text('Verify your email'),
                    content: const Text(
                      'Your account is created. Open the verification email once, then return here and tap I verified my email.',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () => Navigator.of(dialogContext).pop(false),
                        child: const Text('Not yet'),
                      ),
                      FilledButton(
                        onPressed: () => Navigator.of(dialogContext).pop(true),
                        child: const Text('I verified my email'),
                      ),
                    ],
                  ),
                );

                if (!mounted) return;
                if (confirmed != true) {
                  setState(() {
                    _error = 'Verify your email, then tap Create account again or sign in with the same email and password.';
                  });
                  return;
                }

                try {
                  final signInResponse = await ref
                      .read(authRepositoryProvider)
                      .signIn(
                        email: _emailController.text,
                        password: _passwordController.text,
                      )
                      .timeout(const Duration(seconds: 15));
                  if (!mounted) return;
                  if (signInResponse.session == null) {
                    setState(() {
                      _error = 'Email verification is not active yet. Wait a few seconds and try again.';
                    });
                    return;
                  }
                  context.go('/home');
                } catch (error) {
                  if (!mounted) return;
                  setState(() {
                    _error = 'Your account exists, but sign-in is not ready yet. Make sure the email is verified and use the same password, then try again.';
                  });
                }
              } else {
                context.go('/home');
              }"""
          if old not in s:
              raise SystemExit('registration block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Pin Android-compatible secure storage
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/flutter_secure_storage: \^11\.0\.0/flutter_secure_storage: 10.3.1/' chaty_flutter/pubspec.yaml
          grep 'flutter_secure_storage:' chaty_flutter/pubspec.yaml

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chaty_host
          flutter create --platforms=android --org com.chaty /tmp/chaty_host
          cp -a /tmp/chaty_host/android ./chaty_flutter/android
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' chaty_flutter/android/app/build.gradle.kts

      - name: Resolve dependencies
        working-directory: chaty_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: chaty_flutter
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: chaty_flutter
        run: flutter test

      - name: Build configured Android APK
        working-directory: chaty_flutter
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=SUPABASE_URL=https://dntnxeanubswyswahdnj.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_gFpVYJctaDkRRgttvnUl-A_TKu81hFF

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=chaty_flutter/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" Chaty-auth-fixed-debug.apk
          sha256sum Chaty-auth-fixed-debug.apk | tee Chaty-auth-fixed-debug.apk.sha256
          unzip -t Chaty-auth-fixed-debug.apk >/dev/null
          ls -lh Chaty-auth-fixed-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Auth-Fixed-Android-APK
          path: |
            Chaty-auth-fixed-debug.apk
            Chaty-auth-fixed-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
