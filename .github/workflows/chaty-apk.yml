name: Build Chaty APK

on:
  push:
    branches:
      - chaty-apk-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source payload chunks
        shell: bash
        run: |
          set -euo pipefail
          echo '8ba956aa1ee224f6d45ebce449d90c84ee525b49a87b158c2eeb44fbefad7470  chaty-build/chunk_00.b64' | sha256sum -c
          echo 'bf8250896f1ffbd88b69672f0d4ae3128f1ad6537e40b9a2bc825700d925e725  chaty-build/chunk_01.b64' | sha256sum -c
          echo '2e064ab06f55b2fe9f25657f752801012f1fc6a1d425f940cfaf8b46f7539f6b  chaty-build/chunk_02_0.part' | sha256sum -c
          echo '6b64f5b3503d242d045d6e33de6c8e504ce49403982ab743b072f1eb43f5d63d  chaty-build/chunk_02_1.part' | sha256sum -c
          echo '60c52503fd4b04373223f3923a4fd03ac1a1ab3fdc800b36d7691f687b538ac5  chaty-build/chunk_02_2.part' | sha256sum -c
          echo 'be51db2dff7318743ad6c84bc84cbb96ef6d4e304f4d823e22dc3ce2d86b5b4a  chaty-build/chunk_02_3.part' | sha256sum -c
          echo '1cea50010a75fd5c16cac7b1a3922e808e2920dc15370a26b2a75738bc87eb63  chaty-build/chunk_02_4.part' | sha256sum -c
          echo '7233cc2b655a94ec4f44b62475da8b045f23653f5d1fecad0fcbc02ae759e039  chaty-build/chunk_02_5.part' | sha256sum -c
          echo '3f6094ea51f498ff4626e01ce2051925753cd213ee922dea94da742069b6b969  chaty-build/chunk_03.b64' | sha256sum -c
          echo 'aa90de4e75656bfbb5a61f05da1ceca93506de25c156557e711619dc0835f246  chaty-build/chunk_04.b64' | sha256sum -c
          echo 'c1d5b02ec935b970a7fc594421cd2efa74edcb2d83c37ee7e2643cbb25bacbda  chaty-build/chunk_05.b64' | sha256sum -c
          echo 'c842769d5a37896b055689536b6899bd67d429e5ef5444c8ee85909f784c1141  chaty-build/chunk_06.b64' | sha256sum -c
          echo '8e5a08eb8c7c65a901e79d725f30d179b7b7ffcc09bf6e09c7b94aa765245e56  chaty-build/chunk_07.b64' | sha256sum -c

      - name: Reconstruct and verify Chaty source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chaty-build
          mkdir -p /tmp/chaty-build/source
          cat chaty-build/chunk_00.b64 chaty-build/chunk_01.b64 chaty-build/chunk_02_*.part chaty-build/chunk_03.b64 chaty-build/chunk_04.b64 chaty-build/chunk_05.b64 chaty-build/chunk_06.b64 chaty-build/chunk_07.b64 | base64 --decode > /tmp/chaty-build/chaty.zip
          echo "8aeb1c7e54b0c35ebf324627ba4e9745b4d0c2fdc52b6ace8a2138b5c85b98f8  /tmp/chaty-build/chaty.zip" | sha256sum --check
          unzip -q /tmp/chaty-build/chaty.zip -d /tmp/chaty-build/source
          test -f /tmp/chaty-build/source/chaty_flutter/pubspec.yaml
          cp -a /tmp/chaty-build/source/chaty_flutter ./chaty_flutter

      - name: Pin Android-compatible secure storage
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/flutter_secure_storage: \^11\.0\.0/flutter_secure_storage: 10.3.1/' chaty_flutter/pubspec.yaml
          grep 'flutter_secure_storage:' chaty_flutter/pubspec.yaml

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Print toolchain
        run: |
          flutter --version
          java -version

      - name: Generate Android host
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chaty_host
          flutter create --platforms=android --org com.chaty /tmp/chaty_host
          cp -a /tmp/chaty_host/android ./chaty_flutter/android
          APP_GRADLE=chaty_flutter/android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$APP_GRADLE"

      - name: Resolve dependencies
        working-directory: chaty_flutter
        run: flutter pub get

      - name: Analyze
        working-directory: chaty_flutter
        run: flutter analyze

      - name: Test
        working-directory: chaty_flutter
        run: flutter test

      - name: Build Android APK
        working-directory: chaty_flutter
        run: flutter build apk --debug --no-pub

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=chaty_flutter/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          cp "$APK" Chaty-debug.apk
          sha256sum Chaty-debug.apk | tee Chaty-debug.apk.sha256
          unzip -t Chaty-debug.apk >/dev/null
          ls -lh Chaty-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chaty-Android-APK
          path: |
            Chaty-debug.apk
            Chaty-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
